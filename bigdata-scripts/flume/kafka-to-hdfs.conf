# Flume 采集配置：Kafka -> HDFS
# 文件: kafka-to-hdfs.conf

agent.sources = kafkaSource
agent.sinks = hdfsSink
agent.channels = memoryChannel

agent.sources.kafkaSource.type = org.apache.flume.source.kafka.KafkaSource
agent.sources.kafkaSource.kafka.bootstrap.servers = 192.168.100.110:9092
agent.sources.kafkaSource.kafka.topics = user-behavior
agent.sources.kafkaSource.kafka.consumer.group.id = flume-hdfs-group
agent.sources.kafkaSource.batchSize = 1000

agent.channels.memoryChannel.type = memory
agent.channels.memoryChannel.capacity = 10000
agent.channels.memoryChannel.transactionCapacity = 1000

agent.sinks.hdfsSink.type = hdfs
agent.sinks.hdfsSink.hdfs.path = hdfs://192.168.100.110:9000/data/ecommerce/user_behavior/dt=%Y%m%d
agent.sinks.hdfsSink.hdfs.fileType = DataStream
agent.sinks.hdfsSink.hdfs.writeFormat = Text
agent.sinks.hdfsSink.hdfs.rollSize = 134217728
agent.sinks.hdfsSink.hdfs.rollInterval = 600
agent.sinks.hdfsSink.hdfs.rollCount = 0
agent.sinks.hdfsSink.hdfs.useLocalTimeStamp = true

agent.sources.kafkaSource.channels = memoryChannel
agent.sinks.hdfsSink.channel = memoryChannel
